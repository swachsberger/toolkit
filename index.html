<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam / Toolkit</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161a;
    --bg-raised: #1a1d22;
    --border: #2a2d33;
    --border-strong: #383c44;
    --text: #ecebe4;
    --text-muted: #8b8d93;
    --signal: #3ecf8e;
    --amber: #e8a33d;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding: 48px 24px 80px;
  }
  .wrap{ max-width: 880px; margin: 0 auto; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1{
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .clock{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.6;
  }
  .clock span{ color: var(--text); }

  .status-row{
    display:flex;
    gap: 20px;
    margin-bottom: 32px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  .status-row b{ color: var(--text); font-weight: 500; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }

  .tile{
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    text-decoration:none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .tile:hover{
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }

  .tile-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 3px rgba(62,207,142,0.15);
    flex-shrink:0;
  }
  .dot.offline{
    background: var(--text-muted);
    box-shadow: none;
  }
  .tile-code{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .tile-name{
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
  }
  .tile-desc{
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .tile.add{
    border-style: dashed;
    border-color: var(--border-strong);
    align-items:center;
    justify-content:center;
    text-align:center;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 96px;
    cursor: default;
  }
  .tile.add:hover{ transform:none; }

  footer{
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    display:flex;
    justify-content:space-between;
  }

  @media (max-width: 480px){
    header{ flex-direction:column; align-items:flex-start; gap:16px; }
    .clock{ text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Sam /</div>
      <h1>Toolkit</h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="status-row">
    <div><b id="online-count">0</b> online</div>
    <div><b id="total-count">0</b> tools total</div>
  </div>

  <!--
    TO ADD A NEW APP: add an object to this array.
      name    – display name
      code    – short mono label, e.g. its category or app type
      desc    – one line, what it does
      url     – live URL of the deployed app
      online  – true/false, whether it's currently live
  -->
  <div class="grid" id="grid"></div>

  <footer>
    <span>github.com/swachsberger/toolkit</span>
    <span id="footer-date"></span>
  </footer>

</div>

<script>
  const apps = [
    {
      name: "Dice Roller",
      code: "HTML",
      desc: "Two-dice roller with tumbling animation and synthesized clicks.",
      url: "dice-roller/",
      online: true
    },
    {
      name: "Countdown Numbers",
      code: "HTML",
      desc: "The TV numbers game: draw six tiles, hit the target, auto-solver included.",
      url: "countdown/",
      online: true
    },
    {
      name: "Wall Planner",
      code: "HTML",
      desc: "Arrange framed photos on a wall, to scale, before you hang them.",
      url: "https://swachsberger.github.io/wall-planner/",
      external: true,
      online: true
    },
    {
      name: "MTA Mastery",
      code: "HTML",
      desc: "Drills to master the NYC subway map — recall a station's lines, or name every stop on a train.",
      url: "https://swachsberger.github.io/mta-flashcards/",
      external: true,
      online: true
    }
  ];

  const grid = document.getElementById('grid');

  apps.forEach(app => {
    const tile = document.createElement('a');
    tile.className = 'tile';
    tile.href = app.url;
    if (app.external) { tile.target = '_blank'; tile.rel = 'noopener noreferrer'; }
    tile.innerHTML = `
      <div class="tile-top">
        <span class="tile-code">${app.code}</span>
        <span class="dot ${app.online ? '' : 'offline'}"></span>
      </div>
      <div class="tile-name">${app.name}</div>
      <div class="tile-desc">${app.desc}</div>
    `;
    grid.appendChild(tile);
  });

  const addTile = document.createElement('div');
  addTile.className = 'tile add';
  addTile.textContent = '+ add your next app here';
  grid.appendChild(addTile);

  document.getElementById('online-count').textContent = apps.filter(a => a.online).length;
  document.getElementById('total-count').textContent = apps.length;

  function updateClock(){
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    const date = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
    document.getElementById('clock').innerHTML = `<span>${time}</span><br>${date}`;
    document.getElementById('footer-date').textContent = date + ' · NYC';
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
