<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller / Sam Toolkit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a; --bg-raised:#1a1d22; --border:#2a2d33; --border-strong:#383c44;
    --text:#ecebe4; --text-muted:#8b8d93; --signal:#3ecf8e; --amber:#e8a33d;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--sans);
    min-height:100vh; padding:32px 24px 80px; }
  .wrap{ max-width:560px; margin:0 auto; }
  .back{ font-family:var(--mono); font-size:12px; color:var(--text-muted);
    text-decoration:none; letter-spacing:.04em; }
  .back:hover{ color:var(--text); }
  header{ border-bottom:1px solid var(--border); padding-bottom:18px;
    margin:18px 0 32px; }
  h1{ font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:-0.01em; }
  .sub{ font-family:var(--mono); font-size:12px; color:var(--text-muted); margin-top:6px; }

  .dice{ display:flex; align-items:center; justify-content:center; gap:22px; margin:8px 0 28px; }
  .plus{ font-family:var(--mono); font-size:28px; color:var(--text-muted); }
  .die{ width:104px; height:104px; background:var(--bg-raised);
    border:1px solid var(--border-strong); border-radius:16px; padding:14px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    box-shadow:0 6px 16px rgba(0,0,0,.35); transition:transform .06s ease; }
  .die.rolling{ transform:rotate(-4deg) scale(1.03); }
  .cell{ display:flex; align-items:center; justify-content:center; }
  .pip{ width:18px; height:18px; border-radius:50%; background:var(--text);
    box-shadow:0 0 0 3px rgba(62,207,142,.12); }

  .total{ text-align:center; font-family:var(--mono); font-size:22px; font-weight:600;
    min-height:34px; margin-bottom:22px; }
  .total .muted{ color:var(--text-muted); font-weight:400; font-size:16px; }
  .label{ color:var(--signal); }

  button{ font-family:var(--mono); font-size:15px; font-weight:600; color:#0d0f12;
    background:var(--signal); border:none; border-radius:8px; padding:14px 20px;
    width:100%; cursor:pointer; transition:opacity .15s ease, transform .1s ease; }
  button:hover{ opacity:.9; }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Toolkit</a>
  <header>
    <h1>🎲 Dice Roller</h1>
    <div class="sub">TWO DICE · ANIMATED · WITH SOUND</div>
  </header>

  <div class="dice">
    <div class="die" id="die1"></div>
    <div class="plus">+</div>
    <div class="die" id="die2"></div>
  </div>

  <div class="total" id="total"><span class="muted">Press Roll to start</span></div>

  <button id="roll">🎲 Roll!</button>
</div>

<script>
  // Pip layout on a 3x3 grid (cells 0..8, row-major)
  const PIPS = {
    1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8],
  };
  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  const totalEl = document.getElementById('total');
  const rollBtn = document.getElementById('roll');

  function renderDie(el, value){
    const set = new Set(PIPS[value]);
    let html = '';
    for(let i=0;i<9;i++){ html += `<div class="cell">${set.has(i)?'<div class="pip"></div>':''}</div>`; }
    el.innerHTML = html;
  }
  const rand = () => Math.floor(Math.random()*6)+1;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  renderDie(die1,1); renderDie(die2,1);

  // Web Audio click schedule — mirrors the original Streamlit build
  function playClicks(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    function playClick(offsetSec, volume){
      const dur = 0.06;
      const bufSize = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * Math.exp(-i/(bufSize*0.15)); }
      const src = ctx.createBufferSource(); src.buffer = buf;
      const filter = ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=900; filter.Q.value=1.5;
      const gain = ctx.createGain(); gain.gain.value = volume;
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      src.start(ctx.currentTime + offsetSec);
    }
    const frames = 18; let t = 0;
    for(let i=0;i<frames;i++){
      const delay = 0.03 + Math.pow(i/frames,2)*0.10;
      t += delay;
      playClick(t, i===frames-1 ? 1.8 : 0.7);
    }
  }

  function labelFor(total){
    if(total===2) return "Snake Eyes! 🐍";
    if(total===12) return "Boxcars! 🎉";
    if(total===7 || total===11) return "Lucky roll! ⭐";
    return "";
  }

  async function roll(){
    rollBtn.disabled = true;
    totalEl.innerHTML = '<span class="muted">rolling…</span>';
    playClicks();
    const final1 = rand(), final2 = rand();
    const frames = 18;
    die1.classList.add('rolling'); die2.classList.add('rolling');
    for(let i=0;i<frames;i++){
      const r1 = i < frames-1 ? rand() : final1;
      const r2 = i < frames-1 ? rand() : final2;
      renderDie(die1, r1); renderDie(die2, r2);
      const delay = 0.03 + Math.pow(i/frames,2)*0.10; // ease out 30ms → 130ms
      await sleep(delay*1000);
    }
    die1.classList.remove('rolling'); die2.classList.remove('rolling');
    const total = final1 + final2;
    const label = labelFor(total);
    totalEl.innerHTML = `Total: ${total} ${label ? `<span class="label">${label}</span>` : ''}`;
    rollBtn.disabled = false;
  }
  rollBtn.addEventListener('click', roll);
</script>
</body>
</html>
